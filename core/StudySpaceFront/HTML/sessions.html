<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudySpace — Учебные сессии</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0e0e;--bg1:#141414;--bg2:#1a1a1a;--bg3:#222;--bg4:#2a2a2a;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);
  --white:#f5f3ee;--dim:rgba(245,243,238,.5);--muted:rgba(245,243,238,.28);
  --accent:#c8a96e;--accent2:#e2c08a;
  --green:#4ade80;--blue:#60a5fa;--red:#f87171;
  --serif:'DM Serif Display',Georgia,serif;
  --sans:'DM Sans',-apple-system,sans-serif;
  --r:4px;--r-lg:8px;--r-xl:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--white);-webkit-font-smoothing:antialiased;font-weight:300;height:100vh;overflow:hidden;}
.app{display:flex;height:100vh;}
.sidebar{width:300px;flex-shrink:0;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sb-header{padding:20px;border-bottom:1px solid var(--border);}
.sb-title{font-family:var(--serif);font-size:1.1rem;margin-bottom:12px;}
.sb-title span{color:var(--accent);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;font-family:var(--sans);font-size:.82rem;font-weight:500;border:none;cursor:pointer;transition:all .18s;border-radius:var(--r-lg);}
.btn-gold{background:var(--accent);color:#0e0e0e;}.btn-gold:hover{background:var(--accent2);}
.btn-outline{background:transparent;color:var(--white);border:1px solid var(--border2);}.btn-outline:hover{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.04);}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--dim);}.btn-ghost:hover{background:rgba(255,255,255,.1);color:var(--white);}
.btn-sm{padding:6px 13px;font-size:.77rem;}
.btn-xs{padding:4px 10px;font-size:.72rem;}
.btn-red{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.2);}.btn-red:hover{background:rgba(248,113,113,.25);}
.btn-full{width:100%;}
.sb-search{width:100%;padding:8px 12px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:var(--r-lg);color:var(--white);font-family:var(--sans);font-size:.82rem;outline:none;}
.sb-search:focus{border-color:rgba(200,169,110,.4);}
.sb-search::placeholder{color:var(--muted);}
.rooms-list{flex:1;overflow-y:auto;padding:8px;}
.room-item{padding:14px;border-radius:var(--r-xl);border:1px solid var(--border);margin-bottom:6px;cursor:pointer;transition:all .18s;background:var(--bg2);}
.room-item:hover{border-color:var(--border2);background:var(--bg3);}
.room-item.active{border-color:var(--accent);background:rgba(200,169,110,.06);}
.ri-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.ri-name{font-family:var(--serif);font-size:.95rem;line-height:1.2;}
.ri-live{display:flex;align-items:center;gap:4px;font-size:.65rem;color:var(--green);font-weight:500;}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 1.8s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ri-meta{font-size:.72rem;color:var(--muted);}
.ri-bar{height:2px;background:rgba(255,255,255,.07);border-radius:1px;margin-top:8px;overflow:hidden;}
.ri-fill{height:100%;background:var(--accent);border-radius:1px;transition:width .5s;}
.room-view{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--muted);}
.empty-state .big{font-family:var(--serif);font-size:2rem;color:var(--dim);}
.room-header{padding:16px 24px;border-bottom:1px solid var(--border);background:var(--bg1);display:flex;align-items:center;gap:16px;flex-shrink:0;}
.rh-info{flex:1;}
.rh-name{font-family:var(--serif);font-size:1.2rem;margin-bottom:2px;}
.rh-meta{font-size:.75rem;color:var(--muted);}
.rh-actions{display:flex;gap:8px;align-items:center;}
.room-body{flex:1;display:grid;grid-template-columns:1fr 280px;overflow:hidden;}
.chat-area{display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:2px;}
.msg{display:flex;gap:10px;padding:6px 8px;border-radius:var(--r-lg);transition:background .15s;}
.msg:hover{background:rgba(255,255,255,.03);}
.msg.own{flex-direction:row-reverse;}
.msg.own .msg-bubble{background:rgba(200,169,110,.12);border-color:rgba(200,169,110,.2);}
.msg.system{justify-content:center;}
.msg.system .msg-bubble{background:transparent;border:none;color:var(--muted);font-size:.73rem;font-style:italic;}
.msg-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600;flex-shrink:0;margin-top:2px;}
.msg-bubble{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-xl);padding:8px 12px;max-width:340px;}
.msg-name{font-size:.68rem;color:var(--muted);margin-bottom:3px;}
.msg-text{font-size:.85rem;line-height:1.5;word-break:break-word;}
.msg-time{font-size:.63rem;color:var(--muted);margin-top:3px;text-align:right;}
.chat-input-area{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;background:var(--bg1);flex-shrink:0;}
.chat-input{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:var(--r-lg);padding:9px 13px;color:var(--white);font-family:var(--sans);font-size:.84rem;outline:none;resize:none;transition:border-color .2s;min-height:40px;max-height:100px;}
.chat-input:focus{border-color:rgba(200,169,110,.4);}
.chat-input::placeholder{color:var(--muted);}
.right-panel{display:flex;flex-direction:column;overflow:hidden;background:var(--bg1);}
.room-timer{padding:20px;border-bottom:1px solid var(--border);text-align:center;}
.rt-label{font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.rt-ring{position:relative;width:110px;height:110px;margin:0 auto 12px;}
.rt-ring svg{width:110px;height:110px;transform:rotate(-90deg);}
.rt-track{fill:none;stroke:rgba(255,255,255,.06);stroke-width:6;}
.rt-prog{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-dasharray:330;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear,stroke .3s;}
.rt-prog.rest{stroke:var(--blue);}
.rt-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.rt-num{font-family:var(--serif);font-size:1.6rem;letter-spacing:-1px;line-height:1;}
.rt-status{font-size:.6rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:2px;}
.rt-btns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
.rt-cycles{display:flex;gap:5px;justify-content:center;margin-bottom:10px;}
.rt-dot{width:20px;height:3px;border-radius:2px;background:rgba(255,255,255,.1);}
.rt-dot.done{background:var(--accent);}
.rt-dot.cur{background:rgba(200,169,110,.4);animation:cpulse 1s infinite;}
@keyframes cpulse{0%,100%{opacity:.4}50%{opacity:1}}
.participants{flex:1;overflow-y:auto;padding:16px;}
.p-title{font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.participant{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:var(--r-lg);transition:background .15s;}
.participant:hover{background:rgba(255,255,255,.04);}
.p-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:600;flex-shrink:0;}
.p-name{font-size:.82rem;flex:1;}
.p-badge{font-size:.63rem;color:var(--accent);}
.p-status{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;}
.p-status.focusing{background:var(--accent);animation:pulse 2s infinite;}
.modal-bg{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:32px;width:440px;box-shadow:0 24px 64px rgba(0,0,0,.6);}
.modal h2{font-family:var(--serif);font-size:1.5rem;margin-bottom:20px;}
.field-wrap{margin-bottom:12px;}
.field-lbl{font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.field{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:var(--r-lg);padding:9px 13px;font-family:var(--sans);font-size:.84rem;color:var(--white);outline:none;transition:border-color .2s;appearance:none;}
.field:focus{border-color:rgba(200,169,110,.4);}
select.field{cursor:pointer;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;}
.name-modal-bg{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.9);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;}
.name-modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:36px;width:380px;text-align:center;}
.name-modal h2{font-family:var(--serif);font-size:1.8rem;margin-bottom:8px;}
.name-modal p{color:var(--dim);font-size:.85rem;margin-bottom:24px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--bg3);border:1px solid var(--border2);color:var(--white);padding:10px 20px;border-radius:var(--r-lg);font-size:.82rem;opacity:0;transition:all .3s;z-index:1000;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:4px;}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--dim);background:none;border:none;cursor:pointer;padding:6px 10px;border-radius:var(--r-lg);transition:all .2s;}
.back-btn:hover{color:var(--white);background:rgba(255,255,255,.05);}
</style>
</head>
<body>

<div class="name-modal-bg" id="name-modal">
  <div class="name-modal">
    <div style="font-size:2.5rem;margin-bottom:12px">📚</div>
    <h2>Добро пожаловать!</h2>
    <p>Как тебя зовут? Это имя увидят другие участники сессии.</p>
    <input type="text" class="field" id="name-input" placeholder="Твоё имя..." style="text-align:center;margin-bottom:14px" maxlength="20" onkeydown="if(event.key==='Enter')confirmName()">
    <button class="btn btn-gold btn-full" onclick="confirmName()">Войти →</button>
  </div>
</div>

<div class="app">
  <div class="sidebar">
    <div class="sb-header">
      <div class="sb-title">Study<span>Space</span> — Сессии</div>
      <input type="text" class="sb-search" placeholder="🔍 Поиск сессий..." id="search-input" oninput="filterRooms()">
    </div>
    <div style="padding:10px 8px 4px;display:flex;gap:6px;">
      <button class="btn btn-gold btn-sm" style="flex:1" onclick="openCreateModal()">+ Создать</button>
      <button class="btn btn-ghost btn-sm" onclick="refreshRooms()" title="Обновить">↻</button>
    </div>
    <div class="rooms-list" id="rooms-list">
      <div style="color:var(--muted);font-size:.82rem;padding:12px">Загрузка...</div>
    </div>
    <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px">
      <div class="live-dot"></div>
      <span style="font-size:.75rem;color:var(--dim)"><span id="online-count">0</span> онлайн</span>
      <div style="margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--red)" id="ws-dot"></div>
    </div>
  </div>

  <div class="room-view" id="room-view">
    <div class="empty-state" id="empty-state">
      <div style="font-size:3rem">📖</div>
      <div class="big">Выбери сессию</div>
      <div style="font-size:.85rem">Выбери комнату слева или создай новую</div>
      <button class="btn btn-gold" onclick="openCreateModal()">+ Создать сессию</button>
    </div>

    <div id="active-room" style="display:none;flex:1;flex-direction:column;height:100%;">
      <div class="room-header">
        <button class="back-btn" onclick="leaveRoom()">← Назад</button>
        <div class="rh-info">
          <div class="rh-name" id="ar-name">—</div>
          <div class="rh-meta" id="ar-meta">—</div>
        </div>
        <div class="rh-actions">
          <span id="ar-badge" class="btn btn-ghost btn-xs" style="cursor:default"></span>
          <button class="btn btn-red btn-sm" onclick="leaveRoom()">Выйти</button>
        </div>
      </div>

      <div class="room-body">
        <div class="chat-area">
          <div class="chat-messages" id="chat-messages"></div>
          <div class="chat-input-area">
            <textarea class="chat-input" id="chat-input" placeholder="Напиши сообщение... (Enter — отправить)" rows="1"
              onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"
              oninput="autoResize(this)"></textarea>
            <button class="btn btn-gold btn-sm" onclick="sendMessage()">→</button>
          </div>
        </div>

        <div class="right-panel">
          <div class="room-timer">
            <div class="rt-label">Таймер фокуса</div>
            <div class="rt-ring">
              <svg viewBox="0 0 110 110">
                <circle class="rt-track" cx="55" cy="55" r="48"/>
                <circle class="rt-prog" cx="55" cy="55" r="48" id="rt-ring"/>
              </svg>
              <div class="rt-center">
                <div class="rt-num" id="rt-disp">25:00</div>
                <div class="rt-status" id="rt-status">Готов</div>
              </div>
            </div>
            <div class="rt-cycles" id="rt-cycles">
              <div class="rt-dot"></div><div class="rt-dot"></div><div class="rt-dot"></div><div class="rt-dot"></div>
            </div>
            <div class="rt-btns">
              <button class="btn btn-gold btn-xs" id="rt-btn" onclick="toggleRoomTimer()">▶ Старт</button>
              <button class="btn btn-ghost btn-xs" onclick="resetRoomTimer()">↺</button>
              <button class="btn btn-outline btn-xs" id="rt-finish-btn" onclick="finishEarly()" style="display:none">✓ Зачесть</button>
              <select id="rt-dur" class="field" style="width:70px;padding:4px 8px;font-size:.72rem;border-radius:var(--r)" onchange="changeTimerDur()">
                <option value="25">25м</option>
                <option value="50">50м</option>
                <option value="15">15м</option>
                <option value="10">10м</option>
              </select>
            </div>
          </div>

          <div class="participants">
            <div class="p-title">Участники (<span id="p-count">0</span>)</div>
            <div id="participants-list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="create-modal" onclick="if(event.target===this)closeCreateModal()">
  <div class="modal">
    <h2>Новая сессия</h2>
    <div class="field-wrap">
      <div class="field-lbl">Название сессии</div>
      <input type="text" class="field" id="r-name" placeholder="напр. ЕНТ — Математика" maxlength="50">
    </div>
    <div class="field-wrap">
      <div class="field-lbl">Предмет</div>
      <select class="field" id="r-subj">
        <option>Общий</option><option>Математика</option><option>Физика</option>
        <option>Химия</option><option>Биология</option><option>История</option>
        <option>Русский язык</option><option>Английский язык</option><option>Программирование</option>
      </select>
    </div>
    <div class="field-wrap">
      <div class="field-lbl">Максимум участников</div>
      <input type="number" class="field" id="r-max" value="20" min="2" max="100">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeCreateModal()">Отмена</button>
      <button class="btn btn-gold" onclick="createRoom()">Создать и войти</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const BASE = window.location.hostname === 'localhost'
  ? 'http://localhost:3000/api'
  : 'https://studyspace-production-1c1f.up.railway.app/api';
const WS_URL = window.location.hostname === 'localhost'
  ? 'ws://localhost:3000'
  : 'wss://studyspace-production-1c1f.up.railway.app';
const TOKEN = localStorage.getItem('ss_token') || '';
const CIRC_RT = 301.6;

let myName = '';
let myColor = '#c8a96e';
let currentRoom = null;
let allRooms = [];
let messages = {};
let participants = {};
let ws = null;

// Try to get name from main app token
try {
  const me = JSON.parse(localStorage.getItem('ss_me') || 'null');
  if (me && me.name) {
    myName = me.name;
    myColor = me.avatar_color || '#c8a96e';
  }
} catch {}

function randomColor(){
  const c=['#c8a96e','#60a5fa','#4ade80','#f87171','#a78bfa','#fb923c','#34d399'];
  return c[Math.floor(Math.random()*c.length)];
}
function getInitials(name){
  if(!name) return '?';
  const p=name.trim().split(' ');
  return p.length>1?p[0][0]+p[1][0]:name.slice(0,2).toUpperCase();
}
function escHtml(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function now(){ return new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}); }
function autoResize(el){ el.style.height=''; el.style.height=Math.min(el.scrollHeight,100)+'px'; }

// ── NAME ──
function confirmName(){
  const val=document.getElementById('name-input').value.trim();
  if(!val){showToast('Введи имя');return;}
  myName=val; myColor=randomColor();
  localStorage.setItem('ss_name',myName);
  localStorage.setItem('ss_color',myColor);
  document.getElementById('name-modal').style.display='none';
  init();
}

// ── API ──
async function apiFetch(p){
  const r=await fetch(BASE+p,{headers:TOKEN?{Authorization:'Bearer '+TOKEN}:{},signal:AbortSignal.timeout(5000)});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
async function apiPost(p,b={}){
  const r=await fetch(BASE+p,{method:'POST',headers:{'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})},body:JSON.stringify(b),signal:AbortSignal.timeout(5000)});
  return r.json();
}

// ── WEBSOCKET ──
function connectWS(){
  try{
    ws=new WebSocket(WS_URL);
    ws.onopen=()=>{
      document.getElementById('ws-dot').style.background='var(--green)';
      if(TOKEN) ws.send(JSON.stringify({type:'auth',token:TOKEN,color:myColor}));
    };
    ws.onmessage=e=>{
      try{
        const msg=JSON.parse(e.data);
        if(msg.type==='online_count') document.getElementById('online-count').textContent=msg.payload.count;
        if(msg.type==='chat_message'&&currentRoom&&msg.payload.roomId===currentRoom.id){
          if(msg.payload.name!==myName){
            pushMessage(currentRoom.id,{name:msg.payload.name,color:msg.payload.color||'#c8a96e',text:msg.payload.text,time:now(),isMe:false});
            renderMessages(currentRoom.id); scrollChat();
          }
        }
        if(msg.type==='user_joined'&&currentRoom&&msg.payload.roomId===currentRoom.id){
          addSystemMessage(currentRoom.id,msg.payload.name+' присоединился 👋');
          if(!participants[currentRoom.id]) participants[currentRoom.id]=[];
          if(!participants[currentRoom.id].find(p=>p.name===msg.payload.name)){
            participants[currentRoom.id].push({name:msg.payload.name,color:msg.payload.color||randomColor(),status:'online'});
            renderParticipants(currentRoom.id);
          }
        }
        if(msg.type==='user_left'&&currentRoom&&msg.payload.roomId===currentRoom.id){
          addSystemMessage(currentRoom.id,msg.payload.name+' покинул сессию');
          if(participants[currentRoom.id]) participants[currentRoom.id]=participants[currentRoom.id].filter(p=>p.name!==msg.payload.name);
          renderParticipants(currentRoom.id);
        }
        if(msg.type==='focus_start'&&currentRoom&&msg.payload.roomId===currentRoom.id){
          addSystemMessage(currentRoom.id,'⏱ '+msg.payload.name+' начал фокус');
          const p=(participants[currentRoom.id]||[]).find(x=>x.name===msg.payload.name);
          if(p){p.status='focusing';renderParticipants(currentRoom.id);}
        }
        if(msg.type==='focus_done'&&currentRoom&&msg.payload.roomId===currentRoom.id){
          addSystemMessage(currentRoom.id,'🎉 '+msg.payload.name+' завершил '+msg.payload.minutes+'м!');
          const p=(participants[currentRoom.id]||[]).find(x=>x.name===msg.payload.name);
          if(p){p.status='online';renderParticipants(currentRoom.id);}
        }
      }catch{}
    };
    ws.onclose=()=>{ document.getElementById('ws-dot').style.background='var(--red)'; setTimeout(connectWS,3000); };
    ws.onerror=()=>ws.close();
  }catch{}
}
function wsSend(obj){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(obj)); }

// ── ROOMS ──
async function loadRooms(){
  try{
    const r=await apiFetch('/rooms');
    allRooms=r.data;
  }catch{
  }
  renderRoomsList();
}

function renderRoomsList(){
  const q=document.getElementById('search-input').value.toLowerCase();
  const list=allRooms.filter(r=>!q||(r.name+r.subject).toLowerCase().includes(q));
  const el=document.getElementById('rooms-list');
  if(!list.length){el.innerHTML='<div style="color:var(--muted);font-size:.8rem;padding:12px">Ничего не найдено</div>';return;}
  el.innerHTML=list.map(r=>{
    const pct=Math.round((r.participants||1)/(r.maxParticipants||20)*100);
    const isCur=currentRoom&&currentRoom.id===r.id;
    return `<div class="room-item ${isCur?'active':''}" onclick="joinRoom('${r.id}')">
      <div class="ri-top"><div class="ri-name">${escHtml(r.name)}</div><div class="ri-live"><div class="live-dot"></div>Live</div></div>
      <div class="ri-meta">${escHtml(r.host||'—')} · ${escHtml(r.subject)} · ${r.participants||1}/${r.maxParticipants||20}</div>
      <div class="ri-bar"><div class="ri-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

function filterRooms(){renderRoomsList();}
async function refreshRooms(){await loadRooms();showToast('Обновлено ✓');}

// ── JOIN ──
async function joinRoom(id){
  const room=allRooms.find(r=>r.id===id);
  if(!room) return;
  if(currentRoom&&currentRoom.id!==id) await doLeave(currentRoom.id);
  currentRoom={...room};
  try{await apiPost('/rooms/'+id+'/join');}catch{}
  if(!messages[id]) messages[id]=[];
  if(!participants[id]){
    participants[id]=[{name:myName,color:myColor,isMe:true,status:'online'}];
  } else if(!participants[id].find(p=>p.isMe)){
    participants[id].unshift({name:myName,color:myColor,isMe:true,status:'online'});
  }
  wsSend({type:'join_room',roomId:id});
  showRoom(room);
  addSystemMessage(id,`Добро пожаловать в "${room.name}" 📚`);
  renderRoomsList();
}

function showRoom(room){
  document.getElementById('empty-state').style.display='none';
  const ar=document.getElementById('active-room');
  ar.style.display='flex';
  document.getElementById('ar-name').textContent=room.name;
  document.getElementById('ar-meta').textContent=`Ведёт ${room.host||'—'} · ${room.participants||1} участников · ${room.subject}`;
  document.getElementById('ar-badge').textContent=room.subject;
  resetRoomTimer();
  renderMessages(room.id);
  renderParticipants(room.id);
  setTimeout(scrollChat,100);
}

// ── LEAVE ──
async function leaveRoom(){
  if(!currentRoom) return;
  wsSend({type:'leave_room',roomId:currentRoom.id});
  await doLeave(currentRoom.id);
  currentRoom=null;
  document.getElementById('active-room').style.display='none';
  document.getElementById('empty-state').style.display='flex';
  resetRoomTimer();
  renderRoomsList();
}
async function doLeave(id){
  try{await apiPost('/rooms/'+id+'/leave');}catch{}
}

// ── CHAT ──
function pushMessage(roomId,msg){
  if(!messages[roomId]) messages[roomId]=[];
  messages[roomId].push(msg);
  if(messages[roomId].length>300) messages[roomId].shift();
}
function addSystemMessage(roomId,text){
  pushMessage(roomId,{system:true,text,time:now()});
  if(currentRoom&&currentRoom.id===roomId){renderMessages(roomId);scrollChat();}
}
function sendMessage(){
  if(!currentRoom) return;
  const input=document.getElementById('chat-input');
  const text=input.value.trim();
  if(!text) return;
  input.value=''; input.style.height='';
  const msg={name:myName,color:myColor,text,time:now(),isMe:true};
  pushMessage(currentRoom.id,msg);
  wsSend({type:'chat_message',roomId:currentRoom.id,text});
  renderMessages(currentRoom.id);
  scrollChat();
}
function renderMessages(roomId){
  const msgs=messages[roomId]||[];
  const el=document.getElementById('chat-messages');
  el.innerHTML=msgs.map(m=>{
    if(m.system) return `<div class="msg system"><div class="msg-bubble">${escHtml(m.text)}</div></div>`;
    const own=m.isMe;
    return `<div class="msg ${own?'own':''}">
      <div class="msg-avatar" style="background:${m.color}20;color:${m.color};border:1px solid ${m.color}40">${getInitials(m.name)}</div>
      <div class="msg-bubble">
        ${!own?`<div class="msg-name">${escHtml(m.name)}</div>`:''}
        <div class="msg-text">${escHtml(m.text)}</div>
        <div class="msg-time">${m.time}</div>
      </div>
    </div>`;
  }).join('');
}
function scrollChat(){const el=document.getElementById('chat-messages');if(el)el.scrollTop=el.scrollHeight;}

// ── PARTICIPANTS ──
function renderParticipants(roomId){
  const list=participants[roomId]||[];
  document.getElementById('p-count').textContent=list.length;
  document.getElementById('participants-list').innerHTML=list.map(p=>`
    <div class="participant">
      <div class="p-avatar" style="background:${p.color}20;color:${p.color};border:1px solid ${p.color}40">${getInitials(p.name)}</div>
      <div class="p-name">${escHtml(p.name)}${p.isMe?' <span style="color:var(--muted);font-size:.7rem">(ты)</span>':''}</div>
      ${p.status==='focusing'?'<div class="p-badge">⏱</div>':''}
      <div class="p-status ${p.status==='focusing'?'focusing':''}"></div>
    </div>`).join('');
}

// ── TIMER ──
const RT={running:false,phase:'work',sec:25*60,total:25*60,cycle:0,timer:null,wMin:25,rMin:5};

function changeTimerDur(){
  if(RT.running) return;
  RT.wMin=parseInt(document.getElementById('rt-dur').value)||25;
  RT.sec=RT.wMin*60; RT.total=RT.sec; RT.phase='work';
  renderRoomTimer();
}

function toggleRoomTimer(){
  if(RT.running){
    clearInterval(RT.timer); RT.running=false;
    document.getElementById('rt-btn').textContent='▶ Продолжить';
    document.getElementById('rt-status').textContent='Пауза';
    setMyStatus('online');
  }else{
    RT.running=true;
    document.getElementById('rt-btn').textContent='⏸ Пауза';
    document.getElementById('rt-status').textContent=RT.phase==='work'?'Фокус':'Перерыв';
    document.getElementById('rt-finish-btn').style.display='';
    RT.timer=setInterval(roomTimerTick,1000);
    if(currentRoom){
      setMyStatus('focusing');
      addSystemMessage(currentRoom.id,myName+' начал сессию фокуса ⏱');
      wsSend({type:'focus_start',roomId:currentRoom.id});
    }
  }
}

function roomTimerTick(){
  if(RT.sec<=0){
    clearInterval(RT.timer); RT.running=false;
    document.getElementById('rt-finish-btn').style.display='none';
    playBeep();
    if(RT.phase==='work'){
      const mins=RT.wMin;
      RT.cycle=Math.min(RT.cycle+1,4); if(RT.cycle>=4) RT.cycle=0;
      RT.phase='rest'; RT.sec=RT.rMin*60; RT.total=RT.sec;
      document.getElementById('rt-btn').textContent='▶ Перерыв';
      document.getElementById('rt-status').textContent='Перерыв!';
      showToast('✦ Сессия завершена! Отдохни');
      setMyStatus('online');
      if(currentRoom){
        addSystemMessage(currentRoom.id,myName+' завершил сессию фокуса 🎉');
        wsSend({type:'focus_done',roomId:currentRoom.id,minutes:mins});
      }
      // Save to backend
      saveFocus(mins);
    }else{
      RT.phase='work'; RT.sec=RT.wMin*60; RT.total=RT.sec;
      document.getElementById('rt-btn').textContent='▶ Новая сессия';
      document.getElementById('rt-status').textContent='Готов';
      showToast('◷ Отдых окончен!');
    }
    renderRoomTimer(); return;
  }
  RT.sec--; renderRoomTimer();
}

function finishEarly(){
  if(!RT.running && RT.sec===RT.total) return;
  const elapsed=RT.total-RT.sec;
  const mins=Math.max(1,Math.floor(elapsed/60));
  clearInterval(RT.timer); RT.running=false;
  document.getElementById('rt-finish-btn').style.display='none';
  document.getElementById('rt-btn').textContent='▶ Старт';
  document.getElementById('rt-status').textContent='Готов';
  setMyStatus('online');
  if(currentRoom){
    addSystemMessage(currentRoom.id,myName+' завершил '+mins+'м фокуса 🎉');
    wsSend({type:'focus_done',roomId:currentRoom.id,minutes:mins});
  }
  saveFocus(mins);
  resetRoomTimer();
}

function saveFocus(mins){
  if(!TOKEN) return;
  fetch(BASE+'/focus/complete',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},
    body:JSON.stringify({minutes:mins,subject:currentRoom?.subject||'Общий',room_id:currentRoom?.id})
  }).then(()=>showToast('✓ '+mins+'м сохранено!')).catch(()=>{});
}

function resetRoomTimer(){
  clearInterval(RT.timer); RT.running=false; RT.phase='work';
  RT.wMin=parseInt(document.getElementById('rt-dur')?.value||25);
  RT.sec=RT.wMin*60; RT.total=RT.sec; RT.cycle=0;
  document.getElementById('rt-btn').textContent='▶ Старт';
  document.getElementById('rt-status').textContent='Готов';
  document.getElementById('rt-finish-btn').style.display='none';
  renderRoomTimer();
}

function renderRoomTimer(){
  const m=Math.floor(RT.sec/60),s=RT.sec%60;
  document.getElementById('rt-disp').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const ring=document.getElementById('rt-ring');
  ring.style.strokeDashoffset=CIRC_RT*(1-RT.sec/RT.total);
  ring.className='rt-prog'+(RT.phase==='rest'?' rest':'');
  document.querySelectorAll('.rt-dot').forEach((d,i)=>{
    d.classList.remove('done','cur');
    if(i<RT.cycle) d.classList.add('done');
    else if(i===RT.cycle&&RT.running&&RT.phase==='work') d.classList.add('cur');
  });
}

function setMyStatus(status){
  if(!currentRoom) return;
  const me=(participants[currentRoom.id]||[]).find(p=>p.isMe);
  if(me){me.status=status;renderParticipants(currentRoom.id);}
}

function playBeep(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [0,250,500].forEach(d=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.frequency.value=880;
      g.gain.setValueAtTime(0,ctx.currentTime+d/1000);
      g.gain.linearRampToValueAtTime(0.3,ctx.currentTime+d/1000+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d/1000+0.4);
      o.connect(g);g.connect(ctx.destination);
      o.start(ctx.currentTime+d/1000);o.stop(ctx.currentTime+d/1000+0.5);
    });
  }catch{}
}

// ── CREATE ──
function openCreateModal(){document.getElementById('create-modal').classList.add('open');}
function closeCreateModal(){document.getElementById('create-modal').classList.remove('open');}
async function createRoom(){
  const name=document.getElementById('r-name').value.trim();
  if(!name){showToast('⚠ Введи название');return;}
  let newRoom;
  try{
    const r=await apiPost('/rooms',{name,host:myName,subject:document.getElementById('r-subj').value,maxParticipants:document.getElementById('r-max').value});
    newRoom=r.data;
    allRooms.push(newRoom);
  }catch{
    newRoom={id:'local-'+Date.now(),name,host:myName,subject:document.getElementById('r-subj').value,participants:1,maxParticipants:parseInt(document.getElementById('r-max').value)||20};
    allRooms.push(newRoom);
  }
  closeCreateModal();
  renderRoomsList();
  await joinRoom(newRoom.id);
  showToast('✦ Сессия создана!');
}

// ── TOAST ──
let _tt;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),3000);
}

// ── INIT ──
async function init(){
  await loadRooms();
  connectWS();
  renderRoomTimer();
  setInterval(loadRooms,30000);
}

if(myName){
  document.getElementById('name-modal').style.display='none';
  init();
} else {
  const saved=localStorage.getItem('ss_name');
  if(saved){myName=saved;myColor=localStorage.getItem('ss_color')||randomColor();document.getElementById('name-modal').style.display='none';init();}
  else document.getElementById('name-input').focus();
}
</script>
